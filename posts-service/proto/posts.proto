syntax = "proto3";

import "google/protobuf/timestamp.proto";

package posts;

option go_package = "./posts";

message Post {
    int64 id = 1;
    string title = 2;
    string post_text = 3;
    string img = 4;
    int32 read_time = 5;
    repeated int64 liked_by = 6;
    int64 user_id = 7;
    string user_name = 8;
    google.protobuf.Timestamp created_at = 9;
}

message Comment {
    int64 id = 1;
    string text = 2;
    int64 user_id = 3;
    string user_name = 4;
    int64 post_id = 5;
}

message Metadata {
    int32 current_page = 1;
    int32 page_size = 2;
    int32 first_page = 3;
    int32 last_page = 4;
    int32 total_records = 5;
}

message GetPostsRequest {
    int64 user_id = 1;
    int32 page = 2;
    int32 limit = 3;
    string sort = 4;
    string title = 5;
}

message GetPostsResponse {
    repeated Post posts = 1;
    Metadata meta_data = 2;
}

message GetPostRequest {
    int64 id = 1;
}

message GetPostResponse {
    Post post = 1;
}

message CreatePostRequest {
    string title = 1;
    string post_text = 2;
    string img = 3;
    int32 read_time = 4;
    int64 user_id = 5;
    string user_name = 6;
}

message UpdatePostRequest {
    int64 id = 1;
    string title = 2;
    string post_text = 3;
    string img = 4;
    int32 read_time = 5;
}

message DeletePostResponse {
    string message = 1;
}

message LikePostRequest {
    int64 id = 1;
    int64 user_id = 2;
}

message GetCommentsForPostResponse {
    repeated Comment comments = 1;
}

message CreateCommentRequest {
    string text = 1;
    int64 user_id = 2;
    int64 post_id = 3;
}

message CreateCommentResponse {
    Comment comment = 1;
}

service PostsService {
    rpc GetPosts(GetPostsRequest) returns (GetPostsResponse);
    rpc GetPost(GetPostRequest) returns (GetPostResponse);
    rpc CreatePost(CreatePostRequest) returns (GetPostResponse);
    rpc UpdatePost(UpdatePostRequest) returns (GetPostResponse);
    rpc DeletePost(GetPostRequest) returns (DeletePostResponse);
    rpc LikePost(LikePostRequest) returns (GetPostResponse);
    rpc DislikePost(LikePostRequest) returns (GetPostResponse);
    rpc GetCommentsForPost(GetPostRequest) returns (GetCommentsForPostResponse);
    rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse);
    rpc DeleteComment(GetPostRequest) returns (DeletePostResponse);
}