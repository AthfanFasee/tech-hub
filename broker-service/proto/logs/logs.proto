syntax = "proto3";

package logs;

option go_package = "/logs";

message Log {
    string name = 1;
    string data = 2;
}

message LogRequest {
    Log LogEntry = 1;
}

message LogResponse {
    bool error = 1;
    string message = 2;
}

service LogService {
    rpc WriteLog(LogRequest) returns (LogResponse);
}